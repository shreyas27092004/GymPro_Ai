name: GymPro AI CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-checks:
    name: Backend Lint & Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Secret Hygiene
        run: |
          git ls-files | Select-String -Pattern "^\.env$|\.pem$|\.key$|venv/|node_modules/|gympro_vector_store/" | ForEach-Object {
            Write-Error "Forbidden file committed: $_"
          }

  frontend-checks:
    name: Frontend Vitest & Production Build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build
